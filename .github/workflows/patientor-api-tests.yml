name: Patientor API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  api_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies & run backend
        run: |
          cd patientor/backend
          npm ci
          npm run build || true
          npm start &
      - name: Run API tests
        run: |
          cd patientor-api-tests
          npm ci
          npm test
